name: CI

on: [push, pull_request]

jobs:
  build-and-test:
    strategy:
      fail-fast: false        # keep testing other systems if one fails
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    env:
      # Tell vcpkg to save and reuse built libraries in this folder.
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-cache,readwrite"

    steps:
      - uses: actions/checkout@v4          # get the code
      - uses: lukka/get-cmake@latest       # install CMake + Ninja
      - uses: ilammy/msvc-dev-cmd@v1       # set up the MSVC compiler (Windows only)
        if: runner.os == 'Windows'

      - name: Install pkg-config (macOS)
        if: runner.os == 'macOS'
        run: brew install pkg-config

      - name: Restore vcpkg binary cache   # reuse libraries built in earlier runs
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}-
            vcpkg-${{ runner.os }}-

      - name: Set up vcpkg                 # same as I did on my Mac
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/vcpkg-cache"
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          else
            "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          fi
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake --preset debug
      - name: Build
        run: cmake --build --preset debug
      - name: Test
        run: ctest --test-dir build/debug --output-on-failure